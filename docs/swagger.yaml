openapi: 3.0.3
info:
  title: BTS.id Recruitment Coding Test API
  description: Microservices REST API for User Authentication and Product Catalog Management.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: API Gateway
paths:
  /api/auth/register:
    post:
      summary: Register a new user
      description: Rate limit 3 requests per 60 seconds per IP.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded

  /api/auth/login:
    post:
      summary: User login
      description: Returns authentication_token and refresh_token. Rate limit 3 requests per 60 seconds.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Invalid input format
        '401':
          description: Invalid username or password
        '429':
          description: Rate limit exceeded

  /api/products:
    get:
      summary: List all products
      description: Filter by search keyword, category, and paginate.
      tags:
        - Products
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Search term to match product title
        - in: query
          name: category
          schema:
            type: string
          description: Exact category match
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page index
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Page size
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductsResponse'

    post:
      summary: Create a new product
      description: Requires valid Bearer authorization. Rate limit 1 request per 5 seconds.
      tags:
        - Products
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductInput'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '429':
          description: Rate limit exceeded

  /api/products/{id}:
    get:
      summary: Get product details
      tags:
        - Products
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Product ID
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found

    put:
      summary: Update an existing product
      description: Requires valid Bearer authorization. Rate limit 1 request per 5 seconds.
      tags:
        - Products
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductInput'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid payload
        '401':
          description: Unauthorized
        '404':
          description: Product not found
        '429':
          description: Rate limit exceeded

    delete:
      summary: Delete a product
      description: Requires valid Bearer authorization. Rate limit 1 request per 5 seconds.
      tags:
        - Products
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Product deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Product not found
        '429':
          description: Rate limit exceeded

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterInput:
      type: object
      required:
        - username
        - password
        - password_confirmation
      properties:
        username:
          type: string
          example: jhon_doe
        password:
          type: string
          example: supersecret
        password_confirmation:
          type: string
          example: supersecret

    LoginInput:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: jhon_doe
        password:
          type: string
          example: supersecret

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: jhon_doe

    AuthTokenResponse:
      type: object
      properties:
        authentication_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Awesome T-Shirt
        price:
          type: number
          example: 99.99
        description:
          type: string
          example: High-quality cotton t-shirt
        category:
          type: string
          example: Clothes
        images:
          type: array
          items:
            type: string
          example:
            - https://placeimg.com/640/480/any
        created_at:
          type: string
          example: "2025-01-01 15:01:04"
        created_by:
          type: string
          example: Jhon Doe
        created_by_id:
          type: string
          example: "1"
        updated_at:
          type: string
          example: "2025-01-01 15:01:04"
        updated_by:
          type: string
          example: Jhon Doe
        updated_by_id:
          type: string
          example: "1"

    CreateProductInput:
      type: object
      required:
        - title
        - price
        - category
        - images
      properties:
        title:
          type: string
          example: Awesome T-Shirt
        price:
          type: number
          example: 99.99
        description:
          type: string
          example: High-quality cotton t-shirt
        category:
          type: string
          example: Clothes
        images:
          type: array
          items:
            type: string
          example:
            - https://placeimg.com/640/480/any

    UpdateProductInput:
      type: object
      properties:
        title:
          type: string
        price:
          type: number
        description:
          type: string
        category:
          type: string
        images:
          type: array
          items:
            type: string

    PaginatedProductsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        meta:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10
            total:
              type: integer
              example: 25
            total_pages:
              type: integer
              example: 3

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          example: Validation failed
